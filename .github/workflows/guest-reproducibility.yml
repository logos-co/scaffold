name: Guest Build Reproducibility

# Proves the claim `[build].guest = "docker"` exists to make (scaffold#259):
# the same guest source, built twice through the pinned
# `risczero/risc0-guest-builder` container, produces byte-identical ELFs — and
# therefore a stable `program_id`.
#
# This is the check `lssa` runs over its committed `artifacts/` directory,
# expressed against a scaffolded project instead. Nothing else in CI can catch
# a regression here: the unit tests pin the `cargo risczero build` invocation,
# and Template E2E exercises the default (host-toolchain) guest build, but only
# an actual container build can show that the bytes come out the same twice.
#
# Heavy — a ~1.7 GB image pull plus a from-scratch guest compile inside the
# container, on top of the full LEZ build `setup` needs. So it is path-gated to
# the code that can break it, plus manual dispatch.

on:
  pull_request:
    paths:
      # The container compiles the *template's* dependency graph, so anything
      # that changes what gets resolved has to be gated in — not just the
      # build strategy. `templates/**` and `src/template/**` change the
      # manifests; `src/constants.rs` carries the pinned builder tag and the
      # LEZ/spel pins the guest depends on.
      #
      # `setup.rs`/`process.rs`/`repo.rs`/`circuits.rs` are what `build` runs
      # before the guest step (it calls setup, and pins HOST_CC for the guest
      # embed); `Cargo.lock` moves the scaffold binary itself.
      - "src/commands/build.rs"
      - "src/commands/new.rs"
      - "src/commands/setup.rs"
      - "src/process.rs"
      - "src/repo.rs"
      - "src/circuits.rs"
      - "src/constants.rs"
      - "templates/**"
      - "src/template/**"
      - "Cargo.lock"
      - ".github/workflows/guest-reproducibility.yml"
      - ".github/actions/scaffold-env/**"
  # Path gating cannot catch this job's main failure mode: the guest build
  # resolves dependencies from crates.io at build time, so a newly published
  # version whose MSRV exceeds the builder image's rustc breaks it with no
  # change to this repository at all. A weekly run turns that from "the next
  # contributor discovers it" into a dated CI failure.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guest-repro-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rebuild-and-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Rust, caches, system packages, the CLI, circuits, and the rzup
      # components (rust, cpp, and the cargo-risczero subcommand this job
      # needs for `cargo risczero build`).
      - name: Prepare scaffold environment
        uses: ./.github/actions/scaffold-env

      # The guest-builder image is ~1.7 GB and the LEZ build several more.
      # Current runners start with ~80 GB free, so the old unconditional
      # cleanup (~2 min of `rm -rf`) bought nothing; keep it as a fallback for
      # a runner image that ships with less.
      - name: Reclaim runner disk (only if low)
        run: |
          set -euo pipefail
          free_gb="$(df -BG --output=avail / | tail -1 | tr -dc '0-9')"
          echo "free: ${free_gb}G"
          if [ "$free_gb" -ge 40 ]; then
            echo "enough free disk; skipping cleanup"
            exit 0
          fi
          # `${VAR:-}` because `set -u` would abort on AGENT_TOOLSDIRECTORY
          # being unset, which it is on some runner images.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-/nonexistent}" || true
          echo "after: $(df -h / | awk 'NR==2 {print $4}') free"

      - name: Render project and run setup
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/target/release/logos-scaffold" new repro-app
          cd repro-app
          "$GITHUB_WORKSPACE/target/release/logos-scaffold" setup

      - name: Pre-pull the pinned guest-builder image
        run: |
          set -euo pipefail
          tag="$(sed -n 's/.*DEFAULT_RISC0_DOCKER_TAG: &str = "\([^"]*\)".*/\1/p' src/constants.rs)"
          if [ -z "$tag" ]; then echo "::error::could not parse DEFAULT_RISC0_DOCKER_TAG"; exit 1; fi
          echo "RISC0_BUILDER_TAG=$tag" >> "$GITHUB_ENV"
          # Pull separately so an image that does not exist for the pinned tag
          # fails here, with a clear message, instead of deep inside a build.
          docker pull "risczero/risc0-guest-builder:$tag"

          # The tag is a risc0 release name, not a Rust version, and the rustc
          # inside is a different (older) number than the tag suggests. That
          # number is what decides whether the template's dependency graph
          # compiles, so record it in every run rather than leaving people to
          # infer it from the tag string.
          image_rustc="$(docker run --rm --entrypoint rustc \
            "risczero/risc0-guest-builder:$tag" +risc0 --version 2>/dev/null \
            || docker run --rm --entrypoint bash "risczero/risc0-guest-builder:$tag" \
                 -lc 'rustc --version' 2>/dev/null || echo 'unknown')"
          echo "builder image rustc: $image_rustc"
          {
            echo "### Builder image"
            echo "\`risczero/risc0-guest-builder:$tag\` — rustc: \`$image_rustc\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # `new` writes TAIL_CALL_TARGETS' docker_program_id into the tail-call
      # guests; if those are stale, the first build rewrites them and pays a
      # second full container rebuild on every fresh project. The digest diff
      # below cannot see that (the first pass already fixed the scratch
      # project), so report the rewrite itself. A warning, not a failure: the
      # guest has no Cargo.lock, so the ids drift with crates.io and would
      # otherwise fail unrelated PRs (and the weekly run) until refreshed.
      # Make it fail again once #315 ships a lock.
      - name: Build guests deterministically (first pass)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/repro-app"
          "$GITHUB_WORKSPACE/target/release/logos-scaffold" build --guest docker \
            | tee "$RUNNER_TEMP/first-pass.log"
          if grep '^Updated .* program id' "$RUNNER_TEMP/first-pass.log"; then
            echo "::warning::TAIL_CALL_TARGETS docker_program_id in src/constants.rs has drifted from what this build produced (see the Updated lines); refresh it so fresh projects skip the second container build. Root cause: the template guest has no Cargo.lock (https://github.com/logos-co/scaffold/issues/315)"
            {
              echo "### Tail-call program ids drifted"
              echo "Refresh \`TAIL_CALL_TARGETS\` in \`src/constants.rs\`. Root cause: [#315](https://github.com/logos-co/scaffold/issues/315)."
              echo '```'
              grep '^Updated .* program id' "$RUNNER_TEMP/first-pass.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Record first-pass digests
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/repro-app"
          bins=target/riscv-guest-docker/riscv32im-risc0-zkvm-elf/docker
          if [ ! -d "$bins" ]; then
            echo "::error::deterministic build produced no $bins directory"
            ls -R target/riscv-guest-docker 2>&1 || true
            exit 1
          fi
          # A pass that emits nothing would make the diff below vacuously true.
          count="$(find "$bins" -maxdepth 1 -name '*.bin' | wc -l)"
          if [ "$count" -eq 0 ]; then
            echo "::error::no .bin artefacts under $bins"
            ls -la "$bins"
            exit 1
          fi
          echo "$count guest ELF(s) built"
          (cd "$bins" && sha256sum ./*.bin) | tee "$RUNNER_TEMP/first.sha"

      # `cargo risczero build` runs `docker build`, so deleting the output
      # tree alone is not a clean rebuild: BuildKit replays every layer from
      # its cache and re-exports the first pass's ELFs, and the diff below
      # compares those bytes with themselves. Drop the build cache (not the
      # pulled image) and fail if any layer was still served from it.
      - name: Rebuild from a clean tree (second pass)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/repro-app"
          rm -rf target/riscv-guest-docker
          docker builder prune --all --force
          "$GITHUB_WORKSPACE/target/release/logos-scaffold" build --guest docker 2>&1 \
            | tee "$RUNNER_TEMP/second-pass.log"
          if grep -E '^#[0-9]+ CACHED' "$RUNNER_TEMP/second-pass.log"; then
            echo "::error::the second pass reused BuildKit cache, so it is not an independent rebuild"
            exit 1
          fi

      - name: Diff the two passes
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/repro-app/target/riscv-guest-docker/riscv32im-risc0-zkvm-elf/docker"
          sha256sum ./*.bin | tee "$RUNNER_TEMP/second.sha"
          if ! diff -u "$RUNNER_TEMP/first.sha" "$RUNNER_TEMP/second.sha"; then
            echo "::error::guest ELFs differ between two builds of identical source — \
          [build].guest = \"docker\" is not reproducible at tag $RISC0_BUILDER_TAG"
            exit 1
          fi
          echo "Reproducible: identical digests across two container builds."
          echo "### Guest build reproducibility" >> "$GITHUB_STEP_SUMMARY"
          echo "Builder image: \`risczero/risc0-guest-builder:$RISC0_BUILDER_TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/second.sha" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # NOTE ON SCOPE: this step checks that both artefact trees exist side by
      # side and hold different bytes — the precondition that makes deploy's
      # ranking matter. It does NOT exercise `discover_program_binaries`; it
      # re-derives the layout with `find`, so a ranking regression would not
      # fail it. The ranking itself is covered by unit tests in
      # `src/commands/deploy.rs` (`prefers_deterministic_docker_output_over_local_release`,
      # `docker_named_crate_is_not_mistaken_for_deterministic_output`), and
      # end-to-end by DOGFOODING D8. Observing it from the CLI needs a running
      # localnet and a funded wallet, which is not worth wiring into a job
      # whose subject is reproducibility.
      - name: Both artefact trees present and distinct
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/repro-app"
          docker_bin="$(find target/riscv-guest-docker -name '*.bin' | head -1)"
          program="$(basename "$docker_bin" .bin)"
          release_bin="$(find target/riscv-guest -path '*release*' -name "$program.bin" | head -1)"
          if [ -z "$release_bin" ]; then
            echo "::error::expected a host-toolchain artefact for $program too (the workspace build makes one)"
            exit 1
          fi
          echo "both artefact trees present for '$program':"
          echo "  docker:  $docker_bin"
          echo "  release: $release_bin"
          if cmp -s "$docker_bin" "$release_bin"; then
            echo "note: docker and host-toolchain ELFs are byte-identical on this runner"
          else
            echo "note: docker and host-toolchain ELFs differ, as expected"
          fi

          # Report the host-toolchain digests too. They are the control: the
          # deterministic digests above must match everywhere, while these are
          # free to differ from another machine's — which is the whole reason
          # `[build].guest = "docker"` exists (scaffold#259). Having both in
          # every run means a maintainer can compare against their own box
          # without re-deriving anything.
          {
            echo "### Host-toolchain digests (NOT expected to be portable)"
            echo '```'
            (cd "$(dirname "$release_bin")" && sha256sum ./*.bin)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "host-toolchain digests:"
          (cd "$(dirname "$release_bin")" && sha256sum ./*.bin)
